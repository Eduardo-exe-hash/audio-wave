services:
  postgres:
    image: postgres:16.14
    container_name: postgres-audiowave
    restart: always
    environment:
      POSTGRES_DB: audiowave_db
      POSTGRES_PASSWORD: DCD453145
      POSTGRES_USER: postgres
    ports:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audiowave_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - audiowave-net

  backend-audiowave:
    build: .
    container_name: backend-audiowave
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audiowave_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: DCD453145
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - audiowave-net

  frontend-audiowave:
    build:
      context: ./src/main/java/com/example/audio_wave/frontend
    container_name: frontend-audiowave
    ports:
      - "3000:80"
    depends_on:
      - backend-audiowave
    security_opt:
      - no-new-privileges:true
    networks:
      - audiowave-net
volumes:
  postgres_data:

networks:
  audiowave-net:
    driver: bridge